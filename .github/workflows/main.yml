name: "PROD DEPLOY"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prod
      aws-assume-role-arn: "arn:aws:iam::641820721432:role/github-actions-pipeline"
      aws-region: "us-east-1"
      aws-statefile-s3-bucket: "pipeline-github-150526"
      aws-lock-dynamodb-table: "table-terraform-lock"